<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UFMS — Login</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- ============ LOGIN CARD ============ -->
  <div id="login-section" class="card">
    <div class="logo">UFMS</div>
    <h1>Sign in</h1>
    <p class="subtitle">User Feedback Management System</p>

    <div id="login-error" class="alert alert-error hidden"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <button type="button" id="toggle-pw" class="btn-icon" aria-label="Show / hide password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
    </form>
  </div>

  <!-- ============ DASHBOARD CARD ============ -->
  <div id="dashboard-section" class="card hidden">
    <div class="logo">UFMS</div>
    <div class="welcome-header">
      <div>
        <p class="subtitle">Welcome back,</p>
        <h2 id="user-name"></h2>
        <span id="user-role" class="badge"></span>
      </div>
      <button id="logout-btn" class="btn btn-outline">Sign out</button>
    </div>

    <hr />

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Email</span>
        <span id="user-email" class="info-value"></span>
      </div>
      <div class="info-item">
        <span class="info-label">User ID</span>
        <span id="user-id" class="info-value mono"></span>
      </div>
      <div class="info-item">
        <span class="info-label">Account created</span>
        <span id="user-created" class="info-value"></span>
      </div>
      <div class="info-item">
        <span class="info-label">Status</span>
        <span class="info-value"><span class="badge badge-green">Active</span></span>
      </div>
    </div>

    <div id="logout-success" class="alert alert-success hidden">You have been signed out.</div>
  </div>

  <footer>UFMS &copy; 2026</footer>

  <script src="/static/app.js"></script>
</body>
</html>
